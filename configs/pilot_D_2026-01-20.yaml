# Pilot D — 2026-01-20
# Designed to reproduce the dynamics of the original pilot under the new
# config-driven-rounds schema. See CONFIG.md for the field-by-field reference.

# === Identity ===
# Path-string label. Only the basename is stored as `experiment_id` in MongoDB
# logs. Convention: set to this file's own filename for new configs.
experiment_config: configs/pilot_D_2026-01-20.yaml

# === Round shape ===

# List of per-round stage sequences. Each entry is ONE round; that round
# repeats `num_rounds` times within a session that uses this condition.
# Allowed tokens:
#   play | watch-demo-1 | watch-demo-2 | choice | online-choice | indicate | feedback
# The pilot has two conditions, mirroring today's two filtered (EN, NE) sessions.
round_game_sequence_conditions:
  - [watch-demo-1, play, watch-demo-2, play]
  - [watch-demo-2, play, watch-demo-1, play]

# Stages appended ONCE per session, after the num_rounds repetitions. Putting
# these inside `round_game_sequence_conditions` would repeat them every round,
# which is rarely what you want — that's why session_end_stages is separate.
session_end_stages: [choice, feedback]

# Number of times the chosen round-sequence repeats in a single session.
num_rounds: 3

# Asteroid pulls per stage instance.
num_pulls_per_play_game: 6
num_pulls_per_watch_game: 6

# === Session sampling ===

# How `round_game_sequence_conditions` becomes the timeline's session list:
#   all_conditions_shuffled       → use each condition once, in shuffled order
#                                    (sessions = len(conditions) × num_times_conditions_repeat)
#   conditions_sampled_uniformly  → draw `num_sessions` from conditions uniformly with replacement
#                                    (sessions = num_sessions × num_times_conditions_repeat)
sampling_method: all_conditions_shuffled

# Required iff sampling_method == conditions_sampled_uniformly. Ignored otherwise.
num_sessions: null

# Outer multiplier: run the chosen sampling method this many times per participant.
# 1 reproduces the pilot (each condition runs exactly once).
num_times_conditions_repeat: 1

# Float in (0, ∞). Subsamples sessions AFTER sampling_method has produced them.
# 1.0 keeps everything. Values >= 1.0 keep all.
prop_of_sessions: 1

# === Demonstrators ===

# Thompson sampler warmup iterations run from α=β=1 priors before the visible
# trajectory begins. Higher = more "experienced" demonstrator; the visible run
# continues from the warmed posterior. demo-1 ≡ pilot's "expert"; demo-2 ≡ "novice".
demo_1_prior_experience: 128
demo_2_prior_experience: 0

# Bandit arm reward probabilities ∈ [0,1]. Permuted per zone.
bandit_payoffs:
  - 0.0
  - 0.1
  - 0.2
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.75
  - 0.8

# Logged-only (no code branch on this value).
demonstrator_sampling_strategy: thompson

# === Zones & UI ===

# session_fixed → one zone for all rounds in a session.
# round_changing → new zone each round.
bandit_assignment_mode: round_changing

# Optional overlay text shown on the first game of each session. Set to null
# (or "") to omit. Replaces the old hardcoded experience-claim message and
# the omit_explicit_experience_transfer_message flag.
experience_message_text: null

# Whether demonstrators get assigned starship names rendered in the UI.
name_demonstrators: true

# Prepend a `demonstrator_presentation` meta stage at the start of each session.
present_demonstrators_apriori: true

# Show "TOTAL REWARD: N" beneath the icon row during gameplay.
display_running_total_reward: true

# Total reward aggregation across sessions:
#   per_session     → reset to 0 at the start of each session. Display labels each
#                     session's tally ("Session N — Total Reward: X") and the end
#                     screen lists each session plus a combined total.
#   across_sessions → keep one running total throughout the experiment. The end
#                     screen shows that single value.
total_reward_scope: per_session

# Insert a recap meta stage between rounds inside a session that reports the
# reward earned in each play game of the round just finished. Only fires for
# rounds that had at least one play game; never after the last round of a session.
report_play_rewards_between_rounds: false

# Browser console verbose logging.
verbose: false

# Where participants are sent after the final screen (Prolific completion URL).
prolific_completion_url: https://app.prolific.com/submissions/complete?cc=CTVM94DF

# Bonus shown on the final screen: TOTAL REWARD × bonus_per_reward, formatted with
# bonus_currency. Omit bonus_per_reward to hide the bonus line.
bonus_per_reward: 0.02
bonus_currency: "$"
