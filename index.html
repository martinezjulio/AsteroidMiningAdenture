<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bandit MVP with Overview Grid</title>
  <!-- Phaser 3 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Our main code -->
  <script defer src="main.js"></script>

  <style>
    body {
      margin: 0; padding: 0;
      background: #222; color: #ddd;
      font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 { color: #fff; }
    #game-container {
      margin-top: 10px;
      position: relative; /* The Phaser canvas goes here */
    }
    /* This is our new single-row grid for the summary icons. */
    #summary-bar {
      width: 800px;         /* Match the Phaser game width, or as you wish */
      min-height: 80px;     /* Some space to ensure images fit */
      margin-top: 10px;     
      display: flex;        /* Flex row */
      flex-direction: row;
      align-items: flex-start;  /* top-align */
      justify-content: flex-start;
      gap: 20px;            /* space between icons/cells */
    }

    /* The overlay for Prolific ID form (unchanged) */
    #prolific-form-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(20, 20, 20, 0.7);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
      visibility: hidden;
    }
    #prolific-form-overlay form {
      onsubmit: return false;
      background: #333;
      padding: 20px;
      border-radius: 8px;
    }
    #prolific-form-overlay input {
      padding: 8px; margin-bottom: 10px; font-size: 16px;
    }
    #prolific-form-overlay button {
      padding: 8px 16px; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Spatially Correlated Multi-Armed Bandit MVP</h1>

  <div id="game-container"></div>

  <!-- The single-row "grid" for displaying user/demonstrator + zone icons -->
  <div id="summary-bar"></div>

  <!-- Overlaid form for Prolific ID -->
  <div id="prolific-form-overlay">
    <form onsubmit="return false;">
      <p id="prolific-form-message">Please enter your Prolific ID below:</p>
      <input type="text" id="prolific-id-input" placeholder="Prolific ID"/>
      <button type="button" id="prolific-submit-btn">Submit</button>
    </form>
  </div>
</body>
</html>
