<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Bandit MVP with Overview Grid and Controls</title>
  <!-- Phaser 3 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Our main code with cache busting -->
  <script defer src="main.js?v=1693484879"></script>

  <style>
    /* Basic page styling */
    body {
      margin: 0; 
      padding: 0;
      background: #222; 
      color: #ddd;
      font-family: sans-serif;
      display: flex; 
      flex-direction: column; 
      align-items: center;
    }
    h1 {
      color: #fff;
    }

    /* The Phaser canvas container */
    #game-container {
      margin-top: 10px;
      position: relative;
      /* We'll apply a thick border in main.js via JS, e.g.:
         element.style.border = "10px solid #ff0000"; */
    }

    /* The single-row "grid" for user/demonstrator + zone icons. */
    #summary-bar {
      width: 800px;         
      min-height: 80px;
      margin-top: 10px;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 20px;
    }

    /* The controls display row below the summary bar. */
    #controls-display {
      width: 800px;
      margin-top: 10px;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center; /* center them horizontally */
      gap: 40px;
    }
    .control-key {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #fff;
    }
    .control-icon {
      font-size: 24px; /* bigger arrow icons */
      margin-bottom: 5px;
    }
    .control-icon.space {
      /* For spacebar, we can show a visual rectangle or just the word "SPACE" */
      display: inline-block;
      padding: 5px 12px;
      border: 2px solid #fff;
      border-radius: 4px;
      font-size: 16px;
    }

    /* The overlay for Prolific ID form */
    #prolific-form-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; 
      height: 100%;
      background-color: rgba(20, 20, 20, 0.7);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      z-index: 9999;
      visibility: hidden; /* toggled via JS */
    }

    #prolific-form-overlay form {
      onsubmit: return false;
      background: #333; 
      padding: 20px; 
      border-radius: 8px;
    }
    #prolific-form-overlay input {
      padding: 8px; 
      margin-bottom: 10px; 
      font-size: 16px;
    }
    #prolific-form-overlay button {
      padding: 8px 16px; 
      font-size: 16px; 
      cursor: pointer;
    }

    /* The overlay for Feedback form */
    #feedback-form-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; 
      height: 100%;
      background-color: rgba(20, 20, 20, 0.7);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      z-index: 9999;
      visibility: hidden; /* toggled via JS */
    }

    #feedback-form-overlay form {
      background: #333; 
      padding: 30px; 
      border-radius: 8px;
      max-width: 500px;
      text-align: center;
    }

    #feedback-form-overlay p {
      color: #fff;
      margin-bottom: 15px;
      font-size: 16px;
    }

    #feedback-question {
      font-weight: bold;
      color: #ffeb3b;
    }

    #feedback-partner-display {
      margin: 20px 0;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #feedback-partner-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      border: 2px solid #fff;
    }

    #feedback-text-input {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      resize: vertical;
      min-height: 80px;
    }

    #feedback-submit-btn {
      padding: 10px 20px; 
      font-size: 16px; 
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }

    #feedback-submit-btn:hover {
      background-color: #45a049;
    }

    #feedback-submit-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <!-- The Phaser game container -->
  <div id="game-container"></div>

  <!-- Single-row "grid" for user/demonstrator icons & zone text -->
  <div id="summary-bar"></div>

  <!-- Controls display below the summary bar -->
  <div id="controls-display">
    <!-- Arrow Up -->
    <div class="control-key">
      <div class="control-icon">↑</div>
      <div>Up</div>
    </div>
    <!-- Arrow Down -->
    <div class="control-key">
      <div class="control-icon">↓</div>
      <div>Down</div>
    </div>
    <!-- Arrow Left -->
    <div class="control-key">
      <div class="control-icon">←</div>
      <div>Left</div>
    </div>
    <!-- Arrow Right -->
    <div class="control-key">
      <div class="control-icon">→</div>
      <div>Right</div>
    </div>
    <!-- Spacebar -->
    <div class="control-key">
      <div class="control-icon space">Spacebar</div>
      <div>Mine for Minerals</div>
    </div>
  </div>

  <!-- Overlaid Prolific form -->
  <div id="prolific-form-overlay">
    <form onsubmit="return false;">
      <p id="prolific-form-message">Please enter your Prolific ID below:</p>
      <input type="text" id="prolific-id-input" placeholder="Prolific ID"/>
      <button type="button" id="prolific-submit-btn">Submit</button>
    </form>
  </div>

  <!-- Overlaid Feedback form -->
  <div id="feedback-form-overlay">
    <form onsubmit="return false;">
      <p id="feedback-form-message">Please fill the box below with your response to the following question:</p>
      <p id="feedback-question">Why did you choose the following partner?</p>
      <div id="feedback-partner-display">
        <img id="feedback-partner-image" src="" alt="Chosen Partner" />
      </div>
      <textarea id="feedback-text-input" placeholder="Enter your response here..." rows="4" cols="50"></textarea>
      <button type="button" id="feedback-submit-btn">Submit</button>
    </form>
  </div>
</body>
</html>
